[project]
name="MUD"
description="M(oo)lti User Dungeon"
dynamic=["version"]
readme="README.md"
dependencies = [
	"python-cowsay",
]
license = "MIT"
authors = [
 {name = "Artyom Osipchuk", email = "artos4002@yandex.ru"}
]

[project.scripts]
mudclient = 'MUD.client:run'
mudserver = 'MUD.server:run'

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
MUD="mood"

[tool.setuptools.package-data]
MUD=["locales/*/*/*.mo",
"locales/*/*/*.po",
"client/*.py",
"server/*.py",
"tests/*",
"custom_monsters/*.txt",
"docs/html/*.html",
"docs/html/**/*",
]
